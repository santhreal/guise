[package]
name = "guise"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
repository = "https://github.com/santhreal/guise"
homepage = "https://santh.dev"
description = "Canonical browser fingerprint bundles, human-behavior timing, and TLS profile re-exports for the Santh fleet"
readme = "README.md"
keywords = ["stealth", "fingerprint", "anti-bot", "browser", "tls"]
categories = ["web-programming", "authentication"]

[dependencies]
rand = { version = "0.8" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
serde_path_to_error = "0.1"
sha2 = { version = "0.10.9", optional = true }
http = { version = "1.4.0", optional = true }
reqwest = { version = "0.12.28", optional = true }
futures = { version = "0.3" }
guise-oracle = { version = "0.1.0" }
guise-choice = { version = "0.1.1" }
guise-pacing = { version = "0.1.0", optional = true }
guise-profiles = { version = "0.1.1", optional = true }
thiserror = { version = "2.0.18" }
toml = { version = "=0.8.23", optional = true }
scanclient = { version = "0.2.1", default-features = false, optional = true }
runtime-foxdriver = { version = "0.1.0", optional = true }
anyhow = { version = "1", optional = true }
tokio = { version = "1" }
# Logging facade for launch-time diagnostics (the Law-10 host-vs-persona TCP/IP
# tell). Fleet-standard (foxdriver + captchaforge use it); only the `browser`
# launch paths emit through it, so it rides that feature.
tracing = { version = "0.1.44", optional = true }

[features]
default = ["fingerprint", "human", "http", "pacing", "rotation", "config"]
fingerprint = ["dep:guise-profiles"]
human = ["pacing"]
pacing = ["dep:guise-pacing"]
rotation = ["fingerprint"]
# Tier-A config surface: defaults → TOML → CLI overrides (rotation, pacing, pool).
config = ["rotation", "pacing", "fingerprint", "dep:toml"]
# Pure browser HTTP header templates. Does not pull scanclient or TLS deps.
http-headers = ["fingerprint", "rotation", "dep:sha2", "dep:http"]
# reqwest integration for crates that need a canonical browser-shaped
# ClientBuilder without pulling scanner transport policy.
reqwest-client = ["http-headers", "dep:reqwest"]
# HTTP/TLS half: re-export scanclient profile types (zero boring-sys cost).
http = ["dep:scanclient", "http-headers"]
# Wire-identical TLS ClientHello via scanclient + wreq (heavy compile).
tls-impersonate = ["http", "scanclient/tls-impersonate"]
# BiDi profile injection into a launched runtime-foxdriver Page. Pulls
# `http-headers` because every persona-launch path enforces the unified coherence
# gate (`http::session_coherence::persona_full_stack_coherence`) before launching 
# the gate lives in that module, so a browser launch genuinely depends on it (its
# TLS-family arm additionally activates when the heavier `http` feature is on).
browser = ["dep:runtime-foxdriver", "dep:anyhow", "dep:tokio", "dep:tracing", "fingerprint", "rotation", "http-headers", "human"]
# Tier-B community profile TOML on disk.
tier-b-toml = ["dep:toml", "fingerprint"]

[dev-dependencies]
proptest = { version = "1.9.0" }
rand = { version = "0.8" }
# Live impersonation reflector test (tls.peet.ws) needs an async runtime + JSON.
tokio = { version = "1" }
serde_json = { version = "1.0.149" }
serde_path_to_error = "0.1"
# Criterion benchmarks for hot paths (G255).
criterion = { version = "0.5.1" }
# Local offline TLS+H2+TCP echo service for deterministic Layer-2 regression (G068).
# Path-only on purpose: dev-deps with a version requirement must resolve from
# crates.io at publish time, which deadlocks against guise-echo's own dep on
# this crate. Path-only dev-deps are stripped from the published manifest.
guise-echo = { version = "0.1.4" }
# The echo regression test drives a raw rustls client against guise-echo.
rustls = { version = "0.23.27", features = ["ring"] }
tokio-rustls = { version = "0.26.4" }
# Release-scorecard timestamping for the live-detector suite (G270).
chrono = { version = "0.4" }

[lints.rust]
unsafe_code = "forbid"

# Declared test targets gate on the features they use via `required-features`
# (the same mechanism the browser/live tests below use) so single-feature builds
# skip them instead of failing to compile on absent modules (G258/G259).
[[test]]
name = "profile_bundle"
path = "tests/unit/profile_bundle.rs"
required-features = ["fingerprint", "rotation"]

# Live impersonation reflector gate, drives the real BoringSSL `StealthClient`
# against tls.peet.ws and checks the REPORTED H2/TLS fingerprint matches guise's
# model. Opt-in via GUISE_LIVE_PEET=1 (+ network egress); skips cleanly otherwise.
[[test]]
name = "live_peet_impersonation"
path = "tests/live_peet_impersonation.rs"
required-features = ["tls-impersonate"]

[[test]]
name = "tls_reexport"
path = "tests/unit/tls_reexport.rs"
required-features = ["http"]

[[test]]
name = "adversarial"
path = "tests/adversarial.rs"
required-features = ["fingerprint", "human", "rotation", "browser"]

[[test]]
name = "property"
path = "tests/property.rs"
required-features = ["fingerprint", "human", "rotation"]

[[test]]
name = "gap"
path = "tests/gap.rs"
required-features = ["fingerprint", "human"]

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["fingerprint", "human", "rotation"]

# Live probe gate, launches a real headless Chromium. Opt-in via
# STEALTH_LIVE_BROWSER=1; skips cleanly otherwise.
[[test]]
name = "probe_live"
path = "tests/probe_live.rs"
required-features = ["browser"]

# Mid-session persona-drift regression (G124/G125). Opt-in via
# STEALTH_LIVE_BROWSER=1; skips cleanly otherwise.
[[test]]
name = "session_drift"
path = "tests/session_drift.rs"
required-features = ["browser"]

# Live profile_js evaluation regression (G074). Opt-in via
# STEALTH_LIVE_BROWSER=1; skips cleanly otherwise.
[[test]]
name = "profile_js_live_eval"
path = "tests/profile_js_live_eval.rs"
required-features = ["browser", "fingerprint"]

# Live diff between browser_catalog header truth values and a real stock
# Firefox (G080/G081). Opt-in via STEALTH_LIVE_BROWSER=1; skips cleanly otherwise.
[[test]]
name = "browser_catalog_live"
path = "tests/browser_catalog_live.rs"
required-features = ["browser", "fingerprint"]

# Offline differential-oracle fixture gate (G190). Deterministic, no browser.
[[test]]
name = "oracle_fixture"
path = "tests/oracle_fixture.rs"
required-features = ["browser"]

# Unified live oracle suite (G209 / G210). Combines the former
# differential_oracle, headful_truth, headless_tells, and stealth_core_tells
# test files into one oracle-driven run.
[[test]]
name = "oracle_live"
path = "tests/oracle_live.rs"
required-features = ["browser"]

# The reynard gate, proves a built reynard engine binary is fingerprint-
# identical to stock Firefox (zero High-severity divergence). Opt-in via
# REYNARD_BIN=/path/to/binary + DISPLAY; skips cleanly otherwise.
[[test]]
name = "reynard_gate"
path = "tests/reynard_gate.rs"
required-features = ["browser"]

# Offline Layer-2 regression against the local guise-echo service (G068).
# Deterministic: no network egress, no third-party reflector flakiness.
[[test]]
name = "local_echo_regression"
path = "tests/local_echo_regression.rs"
required-features = ["fingerprint", "http"]

# Lie-detector live regression (G194). Opt-in via STEALTH_LIVE_BROWSER=1.
[[test]]
name = "lie_detector_live"
path = "tests/lie_detector_live.rs"
required-features = ["browser"]

# Live-detector acceptance suite: per-persona coherence, per-surface evaluation,
# stock-Firefox differential, and release scorecard archival (G251/G252/G254/G270).
# Opt-in via REYNARD_BIN + DISPLAY; skips cleanly otherwise.
[[test]]
name = "live_detector_suite"
path = "tests/live_detector_suite.rs"
required-features = ["browser"]

# Cross-project coherence fence: guise owns the mouse model, reynard must not
# duplicate it (G131/R108/R266).
[[test]]
name = "reynard_mouse_model_ownership"
path = "tests/reynard_mouse_model_ownership.rs"

[package.metadata.santh]
status = "alpha"
